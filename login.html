<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <title>Register - Tech Summit 2026</title>
  </head>

  <body>
    <header>
      <div class="top-row">
        <img class="logoimg" src="images/Logo.png" alt="Tech Summit logo" />

        <h1>Tech Summit 2026</h1>
      </div>

      <nav>
        <a href="index.html">Home</a>
        <a href="why-attend.html">Why Attend</a>
        <a href="service.html">Event Highlights</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h2>Register for Tech Summit 2026</h2>
        <p>Register now and be part of Tech Summit 2026.</p>
      </section>

      <section class="form-section">
        <form>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"/>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"/>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" />
          </div>

          <button type="submit">Register</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Tech Summit. All rights reserved.</p>
    </footer>
  </body>
</html>
